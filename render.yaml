services:
  - type: web
    name: tw-stock-line-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn line_bot_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
