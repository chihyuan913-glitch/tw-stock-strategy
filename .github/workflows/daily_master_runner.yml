name: 台股全策略總指揮日報 (一鍵全策略自動巡邏)

on:
  schedule:
    # 台灣時間週一至週五 17:35 (UTC 09:35) 證交所結算後執行
    - cron: '35 9 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵測試觸發

jobs:
  run-all-strategies:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行全策略選股並發送 LINE 推播
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python run_all.py --line

      - name: 存檔所有選股報表 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-stock-results
          path: strategies/**/result.*
          retention-days: 7
