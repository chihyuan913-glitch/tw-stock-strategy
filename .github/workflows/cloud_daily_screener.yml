name: ☁️ 雲端全策略盤後選股與 LINE 推播

on:
  schedule:
    # 台灣時間週一至週五 21:15 (UTC 13:15) 官方籌碼 (三大法人/融資融券/可轉債) 全沉澱終極版
    - cron: '15 13 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上隨時手動一鍵執行

# 允許 Actions 提交更新後的選股報表回 Git 倉庫
permissions:
  contents: write

jobs:
  run-daily-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 簽出專案代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 檢驗台北盤後選股時段視窗 (21:10 ~ 21:40)
        id: check_window
        run: |
          python3 - << 'EOF'
          import os, sys
          if "." not in sys.path:
              sys.path.insert(0, ".")
          from market_schedule import is_daily_screener_window
          in_win, reason = is_daily_screener_window()
          print(f"[*] 台北盤後選股時段判定: {reason}")
          out_file = os.environ.get("GITHUB_OUTPUT")
          if out_file:
              with open(out_file, "a", encoding="utf-8") as f:
                  f.write(f"in_window={str(in_win).lower()}\n")
          if not in_win:
              print("[⏸️ 視窗外攔截] 當前時間不在 21:10~21:40 視窗內，後續選股與推播步驟將自動跳過。")
          EOF

      - name: 設定 Python 環境 (3.11)
        if: steps.check_window.outputs.in_window == 'true' 
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        if: steps.check_window.outputs.in_window == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行全策略盤後選股並定向推播至專屬 LINE 視窗
        if: steps.check_window.outputs.in_window == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN_BACKUP: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_BACKUP }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_TARGET_STRATEGY_01: ${{ secrets.LINE_TARGET_STRATEGY_01 }}
          LINE_TARGET_STRATEGY_02: ${{ secrets.LINE_TARGET_STRATEGY_02 }}
          LINE_TARGET_STRATEGY_03: ${{ secrets.LINE_TARGET_STRATEGY_03 }}
          LINE_TARGET_STRATEGY_04: ${{ secrets.LINE_TARGET_STRATEGY_04 }}
          LINE_TARGET_STRATEGY_05: ${{ secrets.LINE_TARGET_STRATEGY_05 }}
          LINE_TARGET_STRATEGY_06: ${{ secrets.LINE_TARGET_STRATEGY_06 }}
          LINE_TARGET_STRATEGY_07: ${{ secrets.LINE_TARGET_STRATEGY_07 }}
          LINE_TARGET_STRATEGY_08: ${{ secrets.LINE_TARGET_STRATEGY_08 }}
          LINE_TARGET_STRATEGY_09: ${{ secrets.LINE_TARGET_STRATEGY_09 }}
          LINE_TARGET_STRATEGY_10: ${{ secrets.LINE_TARGET_STRATEGY_10 }}
          LINE_TARGET_STRATEGY_11: ${{ secrets.LINE_TARGET_STRATEGY_11 }}
          LINE_TARGET_STRATEGY_12: ${{ secrets.LINE_TARGET_STRATEGY_12 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CMONEY_ACCOUNT: ${{ secrets.CMONEY_ACCOUNT }}
          CMONEY_PASSWORD: ${{ secrets.CMONEY_PASSWORD }}
          CMONEY_AUTH_TOKEN: ${{ secrets.CMONEY_AUTH_TOKEN }}
        run: |
          python run_all.py --line

      - name: 自動同步最新選股報表與明日買賣建議回 Git 倉庫
        if: steps.check_window.outputs.in_window == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add strategies/**/result.csv strategies/**/result.md lab/data/tomorrow_trading_advisor.csv || true
          if git diff --staged --quiet; then
            echo "[*] 選股報表與決策清單無變更，無需提交。"
          else
            git commit -m "chore(cloud): 自動更新全策略盤後選股與明日買賣建議表 [skip ci]"
            git push
            echo "[✓] 已成功同步最新選股報表與決策清單至 GitHub 倉庫！"
          fi

      - name: 封存選股報表 Artifact
        if: always() && steps.check_window.outputs.in_window == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-screener-results
          path: |
            strategies/**/result.*
            lab/data/tomorrow_trading_advisor.csv
          retention-days: 14
