name: 台股每日選股日報 (布林下軌逆勢法人買超)

on:
  schedule:
    # 台灣時間週一至週五 20:05 (UTC 12:05) 自動執行
    - cron: '5 12 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵測試觸發

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行選股並發送 LINE 推播
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python screener.py --line --export result.csv

      - name: 存檔最新選股報表 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-result-csv
          path: result.csv
          retention-days: 7
