name: 🏆 每週日全策略動態優化與再升級 (Weekly Optimizer)

on:
  schedule:
    # 台灣時間每週日晚上 8 點 (20:00 UTC+8) = UTC 時間每週日中午 12:00 (12:00 UTC)
    - cron: '0 12 * * 0'
  workflow_dispatch: # 支援隨時手動在 GitHub 網頁觸發執行

jobs:
  weekly-optimization:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 3.10 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝專案依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行每週日全策略動態優化與再升級總引擎
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_TARGET_STRATEGY_01: ${{ secrets.LINE_TARGET_STRATEGY_01 }}
          LINE_TARGET_STRATEGY_02: ${{ secrets.LINE_TARGET_STRATEGY_02 }}
          LINE_TARGET_STRATEGY_03: ${{ secrets.LINE_TARGET_STRATEGY_03 }}
          LINE_TARGET_STRATEGY_04: ${{ secrets.LINE_TARGET_STRATEGY_04 }}
        run: |
          python optimize_all.py --line

      - name: 自動提交並推送升級報表與資料庫至 Git 倉庫
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Optimizer"
          git add stock_dict.json weekly_report.md strategies/*/result.csv strategies/*/result.md || true
          if git diff --staged --quiet; then
            echo "[i] 無檔案異動需要提交。"
          else
            git commit -m "chore(weekly): Sunday 20:00 strategy auto-optimization and upgrade [skip ci]"
            git push
            echo "[✓] 週日升級優化成果已成功保存至 GitHub 倉庫！"
          fi
