name: 台股法人起漲盤後選股日報 (雲端自動執行)

on:
  schedule:
    # 台灣時間週一至週五 17:30 (UTC 09:30) 證交所盤後籌碼結算後自動執行
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁手動一鍵測試觸發

jobs:
  run-momentum-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行法人籌碼起漲選股並推播至 LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python strategies/02_institutional_momentum/screener.py --line --export strategies/02_institutional_momentum/result.csv

      - name: 存檔最新選股報表 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: momentum-stock-result
          path: strategies/02_institutional_momentum/result.csv
          retention-days: 7
