name: 🌐 雲端策略12 ETF跨市場雙階段事件雷達

on:
  schedule:
    # 1. 台灣時間週一至週五 08:20 (UTC 00:20)：盤前早鳥跨市場預警快篩
    - cron: '20 0 * * 1-5'
    # 2. 台灣時間週一至週五 09:02 (UTC 01:02)：開盤實盤價格行為確認與下單指令產出
    - cron: '2 1 * * 1-5'
  workflow_dispatch:
    inputs:
      stage:
        description: '執行階段'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'        # 依當前時鐘自動判定 (08:20~08:59 執行早鳥，09:00~13:35 執行開盤確認)
          - 'premarket'   # 強制執行 08:20 盤前早鳥快篩
          - 'confirm'     # 強制執行 09:02 開盤確認與下單卡片產出

jobs:
  run-etf-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 簽出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境 (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行策略 12 雙階段事件雷達
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN_BACKUP: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_BACKUP }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_TARGET_STRATEGY_12: ${{ secrets.LINE_TARGET_STRATEGY_12 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STAGE="${{ github.event.inputs.stage }}"
          if [ -z "$STAGE" ]; then
            STAGE="auto"
          fi

          # 一律以台北時間 (UTC+8) 作為階段與時段守衛判定標準，禁止再以 UTC 小時判斷
          TW_TIME=$(TZ="Asia/Taipei" date +%H%M)
          TW_HOUR=$(TZ="Asia/Taipei" date +%H)
          TW_MIN=$(TZ="Asia/Taipei" date +%M)
          echo "[+] 當前台北時間 (UTC+8): ${TW_HOUR}:${TW_MIN} (數值: ${TW_TIME}) | 指定階段: ${STAGE}"

          if [ "$STAGE" = "premarket" ]; then
            echo "[+] 手動指定 premarket，啟動盤前早鳥快篩..."
            python strategies/12_etf_event_radar/screener.py --line
          elif [ "$STAGE" = "confirm" ]; then
            if [ "$TW_TIME" -gt 1335 ]; then
              echo "[*] [時段守衛] 台北時間已過 13:35 (${TW_HOUR}:${TW_MIN})，收盤後跳過開盤確認。"
              exit 0
            fi
            echo "[+] 手動指定 confirm，啟動開盤確認與下單指令產出..."
            python strategies/12_etf_event_radar/intraday_scanner.py --confirm --line
          else
            # auto 自動模式判定規則：
            # 1. 09:00 之前 (例如 08:20 排程)：執行盤前早鳥 (screener.py)
            # 2. 09:00 ~ 13:35 (例如 09:02 排程)：執行開盤確認 (intraday_scanner.py --confirm --line)
            # 3. 13:35 之後 (例如 GitHub 排程嚴重延遲至下午)：直接跳過，不跑 confirm、不跑 premarket，以成功碼結束
            if [ "$TW_TIME" -lt 0900 ]; then
              echo "[+] 台北時間 09:00 之前 (${TW_HOUR}:${TW_MIN})，啟動 08:20 盤前早鳥跨市場預警快篩..."
              python strategies/12_etf_event_radar/screener.py --line
            elif [ "$TW_TIME" -le 1335 ]; then
              echo "[+] 台北時間 09:00~13:35 之間 (${TW_HOUR}:${TW_MIN})，啟動 09:02 開盤實盤確認與下單指令產出..."
              python strategies/12_etf_event_radar/intraday_scanner.py --confirm --line
            else
              echo "[*] [時段守衛] 台北時間已過 13:35 (${TW_HOUR}:${TW_MIN})，收盤後自動跳過，不執行任何任務，以成功碼結束。"
              exit 0
            fi
          fi

      - name: 自動提交最新選股報表與快取 (result.csv / premarket_candidates.json)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add strategies/12_etf_event_radar/result.csv strategies/12_etf_event_radar/result.md strategies/12_etf_event_radar/premarket_candidates.json all_etf_universe.json || true
          if git diff --staged --quiet; then
            echo "無報表異動，跳過提交。"
          else
            git commit -m "chore(etf-radar): 自動同步策略 12 最新報表與快取 [skip ci]"
            git push
          fi
